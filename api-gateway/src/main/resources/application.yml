server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 50MB
  cloud:
    gateway:
      # Bounded upstream wait (F-9B-5). Above every frontend deadline (<=15s) so browsers keep their own
      # timeout UX; a 504 after a write may still have committed, so clients re-read / retry with the same key.
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:20s}
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
          # travel-social-service is reachable only through the explicit /api/social/** routes below, which
          # carry the rate limiters. An auto-created /travel-social-service/** route would bypass them.
          include-expression: "!serviceId.equalsIgnoreCase('travel-social-service')"
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /$\{segment}
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**, /api/loyalty-points/**
          filters:
            # Keep the original path because user-service already exposes /api/user/**
            # Removing the RewritePath avoids stripping the prefix and causing 400/404 downstream
        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/api/hotel/**,/hotels/**, /cities/**
          filters:
            - RewritePath=/api/hotel/(?<segment>.*), /$\{segment}
        - id: revenue-service
          uri: lb://revenue-service
          predicates:
            - Path=/api/reports/**
          filters:
            - RewritePath=/api/revenue/(?<segment>.*), /$\{segment}
        - id: regulations-service
          uri: lb://regulations-service
          predicates:
            - Path=/api/regulations/**
        - id: hotel-service-v1
          uri: lb://hotel-service
          predicates:
            - Path=/api/v1/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**,/api/payments/**
        - id: place-service
          uri: lb://place-service
          predicates:
            - Path=/places/**, /api/places/**
          filters:
            - RewritePath=/api/places/(?<segment>.*), /places/$\{segment}
        - id: travel-social-create-post
          uri: lb://travel-social-service
          predicates: [Path=/api/social/posts, Method=POST]
          filters:
            - name: RequestRateLimiter
              args: {redis-rate-limiter.replenishRate: 1, redis-rate-limiter.burstCapacity: 3600, redis-rate-limiter.requestedTokens: 360, key-resolver: "#{@socialUserKeyResolver}"}
        - id: travel-social-comment            # 30 comments/hour
          uri: lb://travel-social-service
          predicates: [Path=/api/social/posts/*/comments, Method=POST]
          filters:
            - name: RequestRateLimiter
              args: {redis-rate-limiter.replenishRate: 1, redis-rate-limiter.burstCapacity: 3600, redis-rate-limiter.requestedTokens: 120, key-resolver: "#{@socialUserKeyResolver}"}
        - id: travel-social-like               # 120 like/unlike requests/hour
          uri: lb://travel-social-service
          predicates: [Path=/api/social/posts/*/like, "Method=PUT,DELETE"]
          filters:
            - name: RequestRateLimiter
              args: {redis-rate-limiter.replenishRate: 1, redis-rate-limiter.burstCapacity: 3600, redis-rate-limiter.requestedTokens: 30, key-resolver: "#{@socialUserKeyResolver}"}
        - id: travel-social-report             # 20 reports/day
          uri: lb://travel-social-service
          predicates: [Path=/api/social/reports, Method=POST]
          filters:
            - name: RequestRateLimiter
              args: {redis-rate-limiter.replenishRate: 1, redis-rate-limiter.burstCapacity: 86400, redis-rate-limiter.requestedTokens: 4320, key-resolver: "#{@socialUserKeyResolver}"}
        - id: travel-social-media-upload       # 30 uploads/hour
          uri: lb://travel-social-service
          predicates: [Path=/api/social/media, Method=POST]
          filters:
            - name: RequestRateLimiter
              args: {redis-rate-limiter.replenishRate: 1, redis-rate-limiter.burstCapacity: 3600, redis-rate-limiter.requestedTokens: 120, key-resolver: "#{@socialUserKeyResolver}"}
        - id: travel-social-other-mutations    # edits, deletes, moderation: 600/hour
          uri: lb://travel-social-service
          predicates: [Path=/api/social/**, "Method=POST,PUT,PATCH,DELETE"]
          filters:
            - name: RequestRateLimiter
              args: {redis-rate-limiter.replenishRate: 1, redis-rate-limiter.burstCapacity: 3600, redis-rate-limiter.requestedTokens: 6, key-resolver: "#{@socialUserKeyResolver}"}
        - id: travel-social-read
          uri: lb://travel-social-service
          predicates: [Path=/api/social/**]
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
  boot:
    admin:
      client:
        url: http://localhost:9095

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Same file log as the other services, so Promtail/Loki can ingest Gateway access lines (STD-030).
logging:
  file:
    name: logs/${spring.application.name}-${server.port}.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}:${random.uuid}

# Shared JWT secret, used only to key social rate limits by verified subject (see RateLimitKeyConfig).
jwt:
  secret: ${SECRET_KEY:}
