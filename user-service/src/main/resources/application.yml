server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/checkinn_user
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  flyway:
    baseline-on-migrate: true
  boot:
    admin:
      client:
        url: http://localhost:9095

grpc:
  server:
    port: 9097

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}:${random.uuid}
logging:
  file:
    name: logs/${spring.application.name}-${server.port}.log

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n
      
    file: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n
