spring:
  application:
    name: auth-service
  boot:
    admin:
      client:
        url: http://localhost:9095

server:
  port: 8081

jwt:
  expiration: 86400000

user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

grpc:
  server:
    port: 9091

  client:
    user-service:
      address: "discovery:///user-service"
      negotiationType: plaintext

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}:${random.uuid}

logging:
  file:
    name: logs/${spring.application.name}-${server.port}.log

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n
      
    file: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n