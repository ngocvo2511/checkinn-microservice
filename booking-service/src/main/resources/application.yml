spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/checkinn_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  config:
    import: "optional:configserver:"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    show-sql: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false
  cloud:
    config:
      uri: http://localhost:8888

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  boot:
    admin:
      client:
        url: http://localhost:9095

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8084}

jwt:
  secret: ${SECRET_KEY}

logging:
  file:
    name: logs/${spring.application.name}-${server.port}.log

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n
      
      file: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}:${random.uuid}

# Feign Client configuration
user-service:
  url: ${USER_SERVICE_URL:http://localhost:8082}

grpc:
  server:
    port: 9093

hotel:
  service:
    url: ${HOTEL_SERVICE_URL:http://hotel-service}

app:
  rabbit:
    exchange: ${RABBIT_EXCHANGE:hotel.events}
  token-revocation:
    key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:auth:revoked-token:}
    fail-open: ${TOKEN_REVOCATION_FAIL_OPEN:false}

vnpay:
  tmnCode: W0MI1ZMG
