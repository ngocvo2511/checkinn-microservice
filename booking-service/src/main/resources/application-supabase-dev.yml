# Local process -> approved Supabase database; no startup migration.
spring:
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${BOOKING_DB_POOL_MAX}
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 10000
      connection-init-sql: SET TIME ZONE 'UTC'
  cloud:
    config:
      enabled: false
  config:
    import: ""
  rabbitmq:
    host: localhost
    port: ${SUPABASE_DEV_RABBIT_PORT}
    username: ${SUPABASE_DEV_RABBIT_USERNAME}
    password: ${SUPABASE_DEV_RABBIT_PASSWORD}
    virtual-host: ${SUPABASE_DEV_RABBIT_VHOST}
  data:
    redis:
      host: localhost
      port: ${SUPABASE_DEV_REDIS_PORT}
      database: ${SUPABASE_DEV_REDIS_DATABASE}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/canonical
    baseline-on-migrate: false
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    com.zaxxer.hikari: OFF
