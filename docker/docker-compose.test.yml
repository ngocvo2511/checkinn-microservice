# Explicit opt-in overlay: isolated local test databases, never schema.sql.
# The five owner databases use the canonical V1 schema (init-test-canonical.py) and the `canonical`
# profile. The pre-UUID clone volume checkinn-test_postgres-test-data is retained but no longer mounted.
services:
  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    networks: [checkinn]
    environment:
      POSTGRES_USER: checkinn_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
    volumes: [postgres-test-canonical-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U checkinn_test -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    networks: [checkinn]
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [mailpit-test-data:/data]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 5s
      retries: 12

  user-service:
    environment:
      BOOKING_GRPC_ADDRESS: booking-service:9093
      POINTS_RECOVERY_DELAY_MS: "1000"
      POINTS_RECOVERY_INITIAL_DELAY_MS: "5000"
      POINTS_RECOVERY_RETRY_SECONDS: "2"
      SPRING_PROFILES_ACTIVE: canonical
      CANONICAL_DB_URL: jdbc:postgresql://postgres-test:5432/checkinn_user?currentSchema=public
      CANONICAL_APP_USER: checkinn_test
      CANONICAL_APP_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/checkinn_user
      SPRING_DATASOURCE_USERNAME: checkinn_test
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
    depends_on:
      postgres-test: {condition: service_healthy}

  hotel-service:
    environment:
      SPRING_PROFILES_ACTIVE: canonical
      CANONICAL_DB_URL: jdbc:postgresql://postgres-test:5432/checkinn_hotel?currentSchema=public
      CANONICAL_APP_USER: checkinn_test
      CANONICAL_APP_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/checkinn_hotel
      SPRING_DATASOURCE_USERNAME: checkinn_test
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
    depends_on:
      postgres-test: {condition: service_healthy}

  booking-service:
    environment:
      LOYALTY_SETTLEMENT_DELAY_MS: "500"
      LOYALTY_SETTLEMENT_INITIAL_DELAY_MS: "5000"
      LOYALTY_SETTLEMENT_RETRY_SECONDS: "2"
      SPRING_PROFILES_ACTIVE: canonical
      CANONICAL_DB_URL: jdbc:postgresql://postgres-test:5432/checkinn_booking?currentSchema=public
      CANONICAL_APP_USER: checkinn_test
      CANONICAL_APP_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/checkinn_booking
      SPRING_DATASOURCE_USERNAME: checkinn_test
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
    depends_on:
      postgres-test: {condition: service_healthy}

  revenue-service:
    environment:
      SPRING_PROFILES_ACTIVE: canonical
      CANONICAL_DB_URL: jdbc:postgresql://postgres-test:5432/checkinn_revenue?currentSchema=public
      CANONICAL_APP_USER: checkinn_test
      CANONICAL_APP_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/checkinn_revenue
      SPRING_DATASOURCE_USERNAME: checkinn_test
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
    depends_on:
      postgres-test: {condition: service_healthy}

  regulations-service:
    environment:
      SPRING_PROFILES_ACTIVE: canonical
      CANONICAL_DB_URL: jdbc:postgresql://postgres-test:5432/checkinn_regulations?currentSchema=public
      CANONICAL_APP_USER: checkinn_test
      CANONICAL_APP_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/checkinn_regulations
      SPRING_DATASOURCE_USERNAME: checkinn_test
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
    depends_on:
      postgres-test: {condition: service_healthy}

  place-service:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/checkinn_place
      SPRING_DATASOURCE_USERNAME: checkinn_test
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
    depends_on:
      postgres-test: {condition: service_healthy}

  social-db-init:
    image: postgres:18-alpine
    profiles: [app]
    restart: "no"
    networks: [checkinn]
    environment:
      PGPASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
    entrypoint:
      - sh
      - -c
      - >-
        psql -h postgres-test -U checkinn_test -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'checkinn_social'" | grep -q 1
        || createdb -h postgres-test -U checkinn_test checkinn_social
    depends_on:
      postgres-test: {condition: service_healthy}

  travel-social-service:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/checkinn_social
      SPRING_DATASOURCE_USERNAME: checkinn_test
      SPRING_DATASOURCE_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Run clone-test-databases.py first}
      SOCIAL_CLEANUP_DELAY_MS: "60000"
      SOCIAL_CLEANUP_INITIAL_DELAY_MS: "30000"
    depends_on:
      postgres-test: {condition: service_healthy}
      social-db-init: {condition: service_completed_successfully}

  notification-service:
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      MAIL_USERNAME: checkinn-test@example.invalid
      NOTIFICATION_FROMEMAIL: checkinn-test@example.invalid
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
    depends_on:
      mailpit: {condition: service_healthy}

volumes:
  postgres-test-canonical-data:
  mailpit-test-data:
