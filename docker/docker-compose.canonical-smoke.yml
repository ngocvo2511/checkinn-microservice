# Disposable canonical smoke stack (Batch 9C follow-up). Use only through docker/canonical-smoke.py.
# - Own project name, own network, no named volumes: PostgreSQL/RabbitMQ/Redis data live in tmpfs.
# - Fresh PostgreSQL 18 with five owner databases; schema comes only from canonical V1 via host Flyway.
# - Applications run the `canonical` profile (Hibernate validate, Flyway and SQL init disabled).
# - Loopback-only host ports; never points at Supabase, docker/.env or the legacy checkinn-test clone.
name: checkinn-canonical-smoke

x-java: &java
  init: true
  restart: "no"
  networks: [smoke]
  labels: {checkinn.owner: canonical-smoke}
  logging: {driver: json-file, options: {max-size: "10m", max-file: "2"}}
  healthcheck: &health
    test: [CMD-SHELL, 'curl -fsS http://localhost:$${SERVER_PORT}/actuator/health >/dev/null || exit 1']
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 60s
  environment: &java-env
    SPRING_PROFILES_ACTIVE: canonical
    JAVA_TOOL_OPTIONS: -Xmx256m -Duser.timezone=UTC
    SECRET_KEY: ${SMOKE_SECRET_KEY:?generated by canonical-smoke.py}
    SPRING_CLOUD_CONFIG_ENABLED: "false"
    SPRING_CONFIG_IMPORT: ""
    SPRING_BOOT_ADMIN_CLIENT_ENABLED: "false"
    SERVER_ADDRESS: 0.0.0.0
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: "5672"
    SPRING_RABBITMQ_VIRTUALHOST: checkinn
    SPRING_RABBITMQ_USERNAME: smoke
    SPRING_RABBITMQ_PASSWORD: ${SMOKE_RABBIT_PASSWORD:?generated}
    USER_SERVICE_URL: http://user-service:8082
    HOTEL_SERVICE_URL: http://hotel-service
    REGULATIONS_SERVICE_URL: http://regulations-service:8091
    BOOKING_GRPC_ADDRESS: booking-service:9093
    GRPC_SERVER_ADDRESS: 0.0.0.0
    REFUND_INTERNAL_ENABLED: "false"
  command:
    - --grpc.client.user-service.address=static://user-service:9097
    - --grpc.client.hotel-service.address=static://hotel-service:9092
    - --grpc.client.booking-service.address=static://booking-service:9093
    - --grpc.client.media-service.address=static://media-service:9096

networks:
  smoke: {}

services:
  postgres:
    image: postgres:18-alpine
    labels: {checkinn.owner: canonical-smoke}
    networks: [smoke]
    environment:
      POSTGRES_USER: smoke_admin
      POSTGRES_PASSWORD: ${SMOKE_POSTGRES_PASSWORD:?generated}
      POSTGRES_DB: smoke_admin
    tmpfs: [/var/lib/postgresql]
    volumes: ["${SMOKE_PRIVATE_DIR:?generated}/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ports: ["127.0.0.1:58432:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U smoke_admin -d smoke_admin]
      interval: 3s
      timeout: 3s
      retries: 40

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    labels: {checkinn.owner: canonical-smoke}
    entrypoint: [bash, /usr/local/bin/checkinn-rabbitmq-start.sh]
    # Run as the broker user so the startup CLI and the broker share one Erlang cookie on the empty tmpfs.
    user: "999:999"
    networks: [smoke]
    environment:
      RABBITMQ_DEFAULT_USER: smoke
      RABBITMQ_DEFAULT_PASS: ${SMOKE_RABBIT_PASSWORD:?generated}
      RABBITMQ_DEFAULT_VHOST: checkinn
    tmpfs: ["/var/lib/rabbitmq:uid=999,gid=999,mode=0700"]
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/start.sh:/usr/local/bin/checkinn-rabbitmq-start.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/checkinn-rabbitmq-ready && rabbitmq-diagnostics -q check_running']
      interval: 5s
      timeout: 20s
      retries: 40
      start_period: 20s

  redis:
    image: redis:7-alpine
    labels: {checkinn.owner: canonical-smoke}
    command: [redis-server, --save, "", --appendonly, "no"]
    networks: [smoke]
    tmpfs: [/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20
    labels: {checkinn.owner: canonical-smoke}
    networks: [smoke]
    ports: ["127.0.0.1:58025:8025"]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 3s
      retries: 20

  eureka-server:
    <<: *java
    image: checkinn/eureka-server:canonical-smoke
    environment: {<<: *java-env, SERVER_PORT: "8761", SPRING_PROFILES_ACTIVE: default}
    command: []

  api-gateway:
    <<: *java
    image: checkinn/api-gateway:canonical-smoke
    environment: {<<: *java-env, SERVER_PORT: "8080", SPRING_PROFILES_ACTIVE: default, EUREKA_INSTANCE_HOSTNAME: api-gateway}
    command: []
    ports: ["127.0.0.1:58080:8080"]
    depends_on: {eureka-server: {condition: service_healthy}}

  auth-service:
    <<: *java
    image: checkinn/auth-service:canonical-smoke
    environment: {<<: *java-env, SERVER_PORT: "8081", GRPC_SERVER_PORT: "9091", SPRING_PROFILES_ACTIVE: default, EUREKA_INSTANCE_HOSTNAME: auth-service}
    depends_on: {eureka-server: {condition: service_healthy}, redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  user-service:
    <<: *java
    image: checkinn/user-service:canonical-smoke
    environment:
      <<: *java-env
      SERVER_PORT: "8082"
      GRPC_SERVER_PORT: "9097"
      EUREKA_INSTANCE_HOSTNAME: user-service
      CANONICAL_DB_URL: jdbc:postgresql://postgres:5432/checkinn_user?currentSchema=public
      CANONICAL_APP_USER: smoke_user_app
      CANONICAL_APP_PASSWORD: ${SMOKE_USER_APP_PASSWORD:?generated}
    depends_on: {eureka-server: {condition: service_healthy}, postgres: {condition: service_healthy}, redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  hotel-service:
    <<: *java
    image: checkinn/hotel-service:canonical-smoke
    environment:
      <<: *java-env
      SERVER_PORT: "8083"
      GRPC_SERVER_PORT: "9092"
      EUREKA_INSTANCE_HOSTNAME: hotel-service
      CANONICAL_DB_URL: jdbc:postgresql://postgres:5432/checkinn_hotel?currentSchema=public
      CANONICAL_APP_USER: smoke_hotel_app
      CANONICAL_APP_PASSWORD: ${SMOKE_HOTEL_APP_PASSWORD:?generated}
    depends_on: {eureka-server: {condition: service_healthy}, postgres: {condition: service_healthy}, redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  booking-service:
    <<: *java
    image: checkinn/booking-service:canonical-smoke
    environment:
      <<: *java-env
      SERVER_PORT: "8084"
      GRPC_SERVER_PORT: "9093"
      EUREKA_INSTANCE_HOSTNAME: booking-service
      CANONICAL_DB_URL: jdbc:postgresql://postgres:5432/checkinn_booking?currentSchema=public
      CANONICAL_APP_USER: smoke_booking_app
      CANONICAL_APP_PASSWORD: ${SMOKE_BOOKING_APP_PASSWORD:?generated}
      # Synthetic signing values: URL creation is local signing only; VNPay is never called.
      VNPAY_TMN_CODE: SMOKETEST
      VNPAY_HASH_SECRET: ${SMOKE_VNPAY_SECRET:?generated}
      VNPAY_RETURN_URL: http://localhost:3000/booking/payment/return
      VNPAY_PAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    depends_on: {eureka-server: {condition: service_healthy}, postgres: {condition: service_healthy}, redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  revenue-service:
    <<: *java
    image: checkinn/revenue-service:canonical-smoke
    environment:
      <<: *java-env
      SERVER_PORT: "8088"
      GRPC_SERVER_PORT: "9099"
      EUREKA_INSTANCE_HOSTNAME: revenue-service
      HOTEL_SERVICE_URL: http://hotel-service:8083
      CANONICAL_DB_URL: jdbc:postgresql://postgres:5432/checkinn_revenue?currentSchema=public
      CANONICAL_APP_USER: smoke_revenue_app
      CANONICAL_APP_PASSWORD: ${SMOKE_REVENUE_APP_PASSWORD:?generated}
    depends_on: {eureka-server: {condition: service_healthy}, postgres: {condition: service_healthy}, redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  regulations-service:
    <<: *java
    image: checkinn/regulations-service:canonical-smoke
    environment:
      <<: *java-env
      SERVER_PORT: "8091"
      GRPC_SERVER_PORT: "9094"
      EUREKA_INSTANCE_HOSTNAME: regulations-service
      CANONICAL_DB_URL: jdbc:postgresql://postgres:5432/checkinn_regulations?currentSchema=public
      CANONICAL_APP_USER: smoke_regulations_app
      CANONICAL_APP_PASSWORD: ${SMOKE_REGULATIONS_APP_PASSWORD:?generated}
    depends_on: {eureka-server: {condition: service_healthy}, postgres: {condition: service_healthy}, redis: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}

  notification-service:
    <<: *java
    image: checkinn/notification-service:canonical-smoke
    volumes: [./notification-health.sh:/usr/local/bin/checkinn-notification-health.sh:ro]
    healthcheck:
      <<: *health
      test: [CMD, bash, /usr/local/bin/checkinn-notification-health.sh]
    environment:
      <<: *java-env
      SERVER_PORT: "8086"
      GRPC_SERVER_PORT: "9098"
      SPRING_PROFILES_ACTIVE: default
      EUREKA_INSTANCE_HOSTNAME: notification-service
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_USERNAME: canonical-smoke@example.invalid
      SPRING_MAIL_PASSWORD: ""
      MAIL_USERNAME: canonical-smoke@example.invalid
      NOTIFICATION_FROMEMAIL: canonical-smoke@example.invalid
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
    depends_on: {eureka-server: {condition: service_healthy}, mailpit: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
