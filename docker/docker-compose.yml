services:
  redis:
    image: redis:7-alpine
    container_name: checkinn-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hotel-rabbitmq

    ports:
      - "5672:5672"     # cho app kết nối
      - "15672:15672"   # giao diện web

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

      # tự động tạo exchange, queue
      RABBITMQ_LOAD_DEFINITIONS: /etc/rabbitmq/definitions.json

    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json

  osrm-backend:
    image: osrm/osrm-backend:latest
    container_name: checkinn-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/vietnam-latest.osrm
