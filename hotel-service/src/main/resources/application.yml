spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:postgresql://localhost:5432/checkinn_hotel
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  config:
    import: "optional:configserver:"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  boot:
    admin:
      client:
        url: http://localhost:9095
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8083

grpc:
  server:
    port: 9092
  client:
    media-service:
      address: "discovery:///media-service"
      negotiation-type: plaintext
    user-service:
      address: "discovery:///user-service"
      negotiation-type: plaintext

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}:${random.uuid}

jwt:
  secret: ${SECRET_KEY}

app:
  token-revocation:
    key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:auth:revoked-token:}
    fail-open: ${TOKEN_REVOCATION_FAIL_OPEN:false}

hold:
  expiry:
    minutes: 15

logging:
  file:
    name: logs/${spring.application.name}-${server.port}.log

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n
      
    file: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n
