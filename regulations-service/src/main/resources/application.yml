spring:
  application:
    name: regulations-service
  datasource:
    url: jdbc:postgresql://localhost:5432/checkinn_regulations
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  config:
    import: "optional:configserver:"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  port: 8091

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka


app:
  jwt:
    secret: ${APP_JWT_SECRET:THIS_IS_SUPER_SECRET_KEY_12345678901234567890}
  rabbit:
    exchange: ${RABBIT_EXCHANGE:hotel.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
