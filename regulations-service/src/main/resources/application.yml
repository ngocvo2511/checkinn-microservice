spring:
  application:
    name: regulations-service
  datasource:
    url: jdbc:postgresql://localhost:5432/checkinn_regulations
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  config:
    import: "optional:configserver:"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  boot:
    admin:
      client:
        url: http://localhost:9095

server:
  port: 8091

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka


app:
  jwt:
    secret: ${SECRET_KEY}
  rabbit:
    exchange: ${RABBIT_EXCHANGE:hotel.events}
  token-revocation:
    key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:auth:revoked-token:}
    fail-open: ${TOKEN_REVOCATION_FAIL_OPEN:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}:${random.uuid}
logging:
  file:
    name: logs/${spring.application.name}-${server.port}.log

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n
      
    file: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [user=%X{username:-anonymous}]
      %logger
      - %msg%n
