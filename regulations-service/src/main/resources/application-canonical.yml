# Runtime only: run the guarded canonical migration job before starting this profile.
spring:
  datasource:
    url: ${CANONICAL_DB_URL}
    username: ${CANONICAL_APP_USER}
    password: ${CANONICAL_APP_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      # Bounded wait for a pool connection (same as supabase-dev), below the Gateway's 20 s response timeout,
      # so a database outage reaches clients as 503 DEPENDENCY_UNAVAILABLE instead of a Gateway 504 (F-9D-1).
      connection-timeout: ${CANONICAL_DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/canonical
    baseline-on-migrate: false
    clean-disabled: true
    out-of-order: false
    validate-on-migrate: true
