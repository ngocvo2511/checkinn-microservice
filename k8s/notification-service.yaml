apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: asia-southeast1-docker.pkg.dev/checkinn-microservice/checkinn-repo/notification-service:v1
          ports:
            - containerPort: 8086
          env:
            # --- 1. CẤU HÌNH RABBITMQ (Quan trọng nhất) ---
            - name: RABBIT_HOST
              value: "rabbitmq"
            - name: RABBIT_PORT
              value: "5672"
            - name: RABBIT_USER
              value: "guest"
            - name: RABBIT_PASS
              value: "guest"

            # --- 2. CẤU HÌNH GMAIL ---
            - name: MAIL_HOST
              value: "smtp.gmail.com"
            - name: MAIL_PORT
              value: "587"
            - name: MAIL_USERNAME
              value: "hoangquangnghia123@gmail.com"
            - name: MAIL_PASSWORD
              value: "mueb qrrv wceo vkdu" # Mật khẩu ứng dụng của bạn

            # --- 3. CẤU HÌNH EUREKA ---
            - name: EUREKA_URI
              value: "http://eureka-server:8761/eureka/"
            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: "false"

            # --- 4. PORT ---
            - name: PORT
              value: "8086"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8080       # Các service khác gọi cổng 8080
      targetPort: 8086 # Chuyển vào cổng 8086 của App
  type: ClusterIP