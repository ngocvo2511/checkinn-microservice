apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: asia-southeast1-docker.pkg.dev/checkinn-microservice/checkinn-repo/api-gateway:v1
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "600Mi"
              cpu: "500m"
          env:
            # 1. Ghi đè cấu hình Eureka (Quan trọng nhất)
            # Trỏ về service eureka-server trong nội bộ cluster
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"

            # 2. Cấu hình hiển thị log để dễ debug
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY
              value: "INFO"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80      # Bên ngoài truy cập cổng 80 (HTTP mặc định)
      targetPort: 8080 # Bên trong chuyển vào cổng 8080 của Gateway
  # QUAN TRỌNG: LoadBalancer yêu cầu Google cấp 1 IP Public thật
  type: LoadBalancer