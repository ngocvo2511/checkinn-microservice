server:
  port: ${PORT:8089}

spring:
  application:
    name: travel-social-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkinn_social}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    virtual-host: ${RABBIT_VHOST:checkinn}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2000
          multiplier: 2
          max-interval: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  servlet:
    multipart:
      enabled: true
      max-file-size: 6MB
      max-request-size: 7MB
  boot:
    admin:
      client:
        url: http://localhost:9095

grpc:
  client:
    media-service:
      address: "discovery:///media-service"
      negotiation-type: plaintext
    booking-service:
      address: "discovery:///booking-service"
      negotiation-type: plaintext

social:
  place-service-url: ${PLACE_SERVICE_URL:http://localhost:8087}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
  hotel-service-url: ${HOTEL_SERVICE_URL:http://localhost:8083}
  client:
    connect-timeout: 2s
    read-timeout: 3s
    author-cache-ttl: 5m
  limits:
    post-body-max: 5000
    comment-body-max: 1000
    report-note-max: 500
    max-media-per-post: 5
    max-media-bytes: 5242880
    max-pending-media-per-user: 20
  retention:
    pending-media: 24h
    deleted-content: 30d
  cleanup:
    delay-ms: ${SOCIAL_CLEANUP_DELAY_MS:3600000}
    initial-delay-ms: ${SOCIAL_CLEANUP_INITIAL_DELAY_MS:120000}
    batch-size: 100
  invitations:
    ttl: ${SOCIAL_INVITATION_TTL:30d}
    list-max: 20

app:
  token-revocation:
    key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:auth:revoked-token:}
    fail-open: ${TOKEN_REVOCATION_FAIL_OPEN:false}

jwt:
  secret: ${SECRET_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}:${random.uuid}

logging:
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      %5p
      [${spring.application.name}]
      [traceId=%X{traceId:-}]
      [userId=%X{userId:-anonymous}]
      %logger
      - %msg%n
